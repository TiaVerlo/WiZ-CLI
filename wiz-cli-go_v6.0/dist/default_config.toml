# ----------------------------------------------------------------------------
# *** WiZ-CLI Control *** 
# ----------------------------------------------------------------------------
# default SceneScript config
# --> SceneScript is a declarative TOML-based DSL to define colors and scenes
#     (only the [SCENE] and [COLORS] sections will get evaluated)
# ----------------------------------------------------------------------------



[COLORS]

# default colors
# format: color_name = [R, G, B]
red_pink = [255, 0, 90]
blue_pink = [255, 0, 170]
blue_purple = [95, 0, 255]
purple = [165, 0, 255]
yellow_green = [150, 255, 0]
green = [30, 255, 0]
red = [255, 0, 0]
yellow = [255, 255, 0]
blue = [0, 0, 255]
orange = [255, 128, 0]
deep_orange = [255, 69, 0]
amber = [255, 191, 0]
gold = [255, 215, 0]
turquoise = [64, 224, 208]
emerald = [80, 200, 120]
teal = [0, 128, 128]
cyan = [0, 255, 255]
lightblue = [135, 206, 235]
lime = [0, 255, 0]
forest_green = [34, 139, 34]
mint = [152, 251, 152]
sky_blue = [0, 191, 255]
navy = [0, 0, 128]
indigo = [75, 0, 130]
magenta = [255, 0, 255]
orchid = [218, 112, 214]
bright_pink = [255, 105, 180]
pink = [255, 20, 147]
violet = [238, 130, 238]
lavender = [230, 230, 250]
plum = [221, 160, 221]
coral = [255, 127, 80]



[SCENES]

[scenes.rose]
description = "sets the bulb to a static rose color"
loop = false
actions = [
    { method = "setOff", },
    { method = "setColor", rgb = { r = 255, g = 0, b = 65, }, brightness = 100, cw = { c = 0, w = 110, }, }
]

[scenes.off_in_5m]
description = "turns the bulb off after 1 hour"
loop = false
actions = [
    { method = "delay", ms = 300000, },
    { method = "setOff", }
]

[scenes.off_in_1h]
description = "turns the bulb off after 1 hour"
loop = false
actions = [
    { method = "delay", ms = 3600000, },
    { method = "setOff", }
]

[scenes.blink_red_once]
description = "blinks the bulb red a single time"
loop = false
actions = [
    { method = "setOff", },
    { method = "delay", ms = 250, },
    { method = "setColor", rgb = { r = 255, g = 0, b = 0, }, brightness = 100, cw = { c = 0, w = 0, }, },
    { method = "delay", ms = 750, },
    { method = "setOff", }
]

[scenes.blink_red_loop]
description = "blinks the bulb red continuously"
loop = true
actions = [
    { method = "setOn", },
    { method = "setColor", rgb = { r = 255, g = 0, b = 0, }, brightness = 100, cw = { c = 0, w = 0, }, },
    { method = "delay", ms = 500, },
    { method = "setOff", },
    { method = "delay", ms = 500, }
]

# For the complex fade scenes, we map to the fadeTransition function parameters
[scenes.fade_purple_pink]
description = "continuously fades through a sequence of purple and pink colors"
loop = true
actions = [
    { method = "fadeSequence", steps = 50, delay_ms = 300, colors = [
        { r = 164, g = 0, b = 255, },
        { r = 255, g = 0, b = 170, },
        { r = 255, g = 0, b = 92, },
        { r = 255, g = 0, b = 170, }
    ],}
]